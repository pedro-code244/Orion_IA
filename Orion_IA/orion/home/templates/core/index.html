{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>Orion IA</title>
</head>
<body>

    <div class="container">
        <h1>Login Orion IA</h1>

        <br><br>
        <form method="post">
            {% csrf_token %}

            <input placeholder="Digite Seu Nome: " type="text" name="user" required>

            <input placeholder="Digite Sua Senha: " type="password" name="password" required>

            <button type="submit">Entrar</button>
        </form>
    </div>
    
</body>
</html>
